<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Diary</title>

  <link
  rel="manifest"
  href="manifest.json"
  >

  <meta
  name="theme-color"
  content="#f4f2ed"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <!-- =====================
       로그인 화면
  ====================== -->

  <section
    id="loginScreen"
    class="login-screen"
  >

    <div class="login-box">

      <p class="login-small-title">
        MY DIARY
      </p>

      <h1>
        Your days,<br>
        kept here.
      </h1>

      <p class="login-description">
        당신의 하루를 기록하고<br>
        어디서든 다시 만나보세요.
      </p>

      <button
        id="googleLoginBtn"
        class="google-login-button"
      >
        G&nbsp;&nbsp; Google로 계속하기
      </button>

    </div>

  </section>


  <!-- =====================
       일기 앱
  ====================== -->

  <main
    id="diaryApp"
    class="app"
    style="display: none;"
  >

    <!-- =====================
         홈 화면
    ====================== -->

    <section
      id="homeScreen"
      class="screen active"
    >

      <header class="home-header">

        <div class="home-top">

          <p class="small-title">
            MY DIARY
          </p>

          <button
            id="logoutBtn"
            class="logout-button"
          >
            로그아웃
          </button>

        </div>


        <h1>
          My days.
        </h1>


        <p class="home-subtitle">
          오늘의 순간을 기록하세요.
        </p>


        <p
          id="userEmail"
          class="user-email"
        ></p>

      </header>


      <!-- 달력 -->

      <section class="calendar-card">

        <div class="calendar-header">

          <button
            id="prevMonth"
            class="calendar-nav"
          >
            ‹
          </button>


          <h2 id="calendarTitle"></h2>


          <button
            id="nextMonth"
            class="calendar-nav"
          >
            ›
          </button>

        </div>


        <div class="weekdays">

          <span>일</span>
          <span>월</span>
          <span>화</span>
          <span>수</span>
          <span>목</span>
          <span>금</span>
          <span>토</span>

        </div>


        <div
          id="calendarDays"
          class="calendar-days"
        ></div>

      </section>


      <button
        id="todayWriteBtn"
        class="main-button"
      >
        + 오늘 기록하기
      </button>


      <!-- 최근 기록 -->

      <section class="recent-section">

        <div class="section-header">

          <h2>
            최근 기록
          </h2>

          <span id="entryCount"></span>

        </div>


        <div id="recentList"></div>

      </section>

    </section>



    <!-- =====================
         일기 작성 화면
    ====================== -->

    <section
      id="editorScreen"
      class="screen"
    >

      <header class="editor-header">

        <button
          id="backBtn"
          class="back-button"
        >
          ←
        </button>


        <div>

          <p
            id="editorDate"
            class="editor-date"
          ></p>

          <h1>
            오늘의 기록
          </h1>

        </div>

      </header>


      <!-- 기분 -->

      <section class="card">

        <h2>
          오늘 기분은 어때요?
        </h2>


        <div class="moods">

          <button class="mood">
            😢
          </button>

          <button class="mood">
            😐
          </button>

          <button class="mood">
            🙂
          </button>

          <button class="mood">
            😊
          </button>

          <button class="mood">
            🥰
          </button>

        </div>

      </section>


      <!-- 글 -->

      <section class="card">

        <label for="title">
          제목
        </label>


        <input
          id="title"
          type="text"
          placeholder="오늘 하루를 한마디로 표현한다면?"
        >


        <label for="content">
          오늘 있었던 일
        </label>


        <textarea
          id="content"
          placeholder="오늘의 이야기를 자유롭게 적어보세요."
        ></textarea>

      </section>


      <!-- 사진 -->

      <section class="card">

        <div class="photo-title-row">

          <h2>
            오늘의 사진
          </h2>


          <label
            for="photoInput"
            class="photo-button"
          >
            + 사진
          </label>

        </div>


        <input
          id="photoInput"
          type="file"
          accept="image/*"
          multiple
          hidden
        >


        <p class="photo-guide">
          사진 수 제한 없이 원본으로 저장됩니다.
        </p>


        <div
          id="photoPreview"
          class="photo-preview"
        ></div>

      </section>


      <!-- 저장 / 삭제 -->

      <div class="button-group">

        <button
          id="saveBtn"
          class="save-button"
        >
          기록 저장
        </button>


        <button
          id="deleteBtn"
          class="delete-button hidden"
        >
          삭제
        </button>

      </div>

    </section>

  </main>


  <!-- =====================
       JavaScript
  ====================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="auth.js"></script>

  <script src="db.js"></script>

  <script src="app.js"></script>

  <script>
  if ("serviceWorker" in navigator) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register("./service-worker.js")
          .then(() => {
            console.log(
              "Service Worker 등록 완료"
            );
          })
          .catch(error => {
            console.error(
              "Service Worker 오류:",
              error
            );
          });

      }
    );

  }
</script>

</body>

</html>
